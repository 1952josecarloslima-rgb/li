<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel Jovem — convidados</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --bg1:#1d2370; --bg2:#141850; --bg3:#0b0d33;
    --cream:#efeadc; --aqua:#7ff0b4; --aqua2:#1f9a63; --ink:#0f1240; --red:#e2342b;
    --col:72px;                 /* margem da coluna de texto */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;background:var(--bg2);overflow:hidden}
  .art{position:relative;width:1080px;height:1920px;overflow:hidden;
    background:radial-gradient(120% 70% at 70% 50%, var(--bg1) 0%, var(--bg2) 60%, var(--bg3) 100%)}
  svg.layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .grain{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:overlay;opacity:.55;pointer-events:none}
  .scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 3px, transparent 3px 9px)}
  .ruler{position:absolute;right:14px;top:-60px;width:92px;height:2040px;background:var(--cream);
    transform:rotate(1.2deg);opacity:.20}
  .ruler svg{width:100%;height:100%}

  /* cabeçalho */
  .logo{position:absolute;top:66px;left:var(--col);width:92px;z-index:6}
  .tag{position:absolute;left:198px;top:82px;font-family:'Montserrat';font-weight:900;font-size:34px;color:var(--ink);
    background:var(--cream);padding:10px 24px 8px;box-shadow:6px 7px 0 rgba(0,0,0,.35);transform:rotate(-2deg);z-index:6}
  .tag::before,.tag::after{content:"";position:absolute;width:60px;height:24px;background:rgba(255,255,255,.45)}
  .tag::before{left:-24px;top:-10px;transform:rotate(-32deg)}
  .tag::after{right:-24px;bottom:-8px;transform:rotate(-32deg)}
  .count{position:absolute;right:130px;top:70px;z-index:6;font-family:'Anton';font-size:84px;line-height:1;color:var(--aqua)}
  .count small{font-size:40px;color:var(--cream);opacity:.7}

  /* bloco do nome — tudo alinhado na mesma margem */
  .head{position:absolute;left:var(--col);top:250px;z-index:7}
  .kicker{font-family:'Montserrat';font-weight:800;font-size:26px;letter-spacing:.26em;color:var(--cream);opacity:.85}
  .g{position:relative;margin-top:10px;height:var(--h);width:900px;
    -webkit-mask-image:url(grunge.png);mask-image:url(grunge.png);-webkit-mask-size:1000px 350px;mask-size:1000px 350px}
  .g span{position:absolute;left:0;top:0;font-family:'Anton';line-height:1;white-space:nowrap}
  .g .ext{color:var(--aqua);transform:translate(4px,4px)}
  .g .face{color:var(--cream)}
  .sur{font-family:'Knewave';font-size:112px;line-height:1;color:var(--aqua);text-shadow:6px 6px 0 var(--ink);
    margin-top:-14px;margin-left:6px;white-space:nowrap}
  .rolebar{display:inline-flex;align-items:stretch;margin-top:26px;box-shadow:6px 7px 0 rgba(0,0,0,.35)}
  .rolebar span{font-family:'Montserrat';font-weight:900;font-size:27px;letter-spacing:.08em;padding:10px 18px 9px;white-space:nowrap}
  .rolebar .a{background:var(--cream);color:var(--ink)}
  .rolebar .b{background:var(--aqua);color:var(--ink)}

  /* foto */
  .person{position:absolute;bottom:150px;z-index:3;
    filter:drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff)
           drop-shadow(16px 18px 0 rgba(0,0,0,.30))}
  /* sombra suave atrás da coluna de texto, para leitura */
  .shade{position:absolute;left:0;top:0;bottom:0;width:640px;z-index:4;
    background:linear-gradient(90deg, rgba(11,13,51,.82) 0%, rgba(11,13,51,.6) 55%, rgba(11,13,51,0) 100%)}

  /* bio em linha do tempo / régua */
  .bio{position:absolute;left:var(--col);width:450px;z-index:7;padding-left:44px}
  .bio::before{content:"";position:absolute;left:9px;top:12px;bottom:12px;width:4px;background:var(--aqua);opacity:.6}
  .item{position:relative}
  .item + .item{margin-top:46px}
  .item::before{content:"";position:absolute;left:-44px;top:6px;width:22px;height:22px;background:var(--aqua);
    border:5px solid var(--bg2);box-shadow:0 0 0 3px var(--aqua);border-radius:50%}
  .item .lb{font-family:'Montserrat';font-weight:900;font-size:23px;letter-spacing:.2em;color:var(--aqua)}
  .item p{margin-top:10px;font-family:'Montserrat';font-weight:600;font-size:31px;line-height:1.32;color:var(--cream)}
  .item p b{font-weight:900;color:#fff}

  /* selo (Gean) */
  .seal{position:absolute;z-index:8;width:230px;height:230px;border-radius:50%;background:var(--aqua);color:var(--ink);
    display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:8px 10px 0 rgba(0,0,0,.35);
    border:6px dashed var(--ink);outline:8px solid var(--aqua);font-family:'Montserrat';font-weight:900;line-height:1.05}
  .seal div{font-size:21px;letter-spacing:.06em}
  .seal strong{display:block;font-family:'Anton';font-weight:400;font-size:46px;letter-spacing:.02em;margin:4px 0}

  /* faixa de baixo */
  .band{position:absolute;left:0;right:0;bottom:0;height:170px;z-index:9}
  .band .torn{position:absolute;left:0;right:0;top:-24px;width:100%;height:194px}
  .band .c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:24px;padding-top:14px;
    font-family:'Montserrat';color:var(--ink)}
  .when{display:flex;border:4px solid var(--ink)}
  .when div{font-family:'Archivo Black';font-size:40px;padding:0 18px;line-height:1.2}
  .when div + div{border-left:4px solid var(--ink)}
  .when .hi{background:var(--aqua)}
  .where strong{display:block;font-weight:900;font-size:23px;white-space:nowrap}
  .where small{display:block;font-weight:600;font-size:16px;margin-top:3px;white-space:nowrap}
</style>
</head>
<body>
<div class="art" id="art">
  <svg class="layer" id="topo" viewBox="0 0 1080 1920"></svg>
  <div class="scan"></div>
  <svg class="grain" preserveAspectRatio="none">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
  <div class="ruler"><svg id="ruler" viewBox="0 0 92 2040"></svg></div>

  <img class="logo" src="logo_white.png" alt="">
  <div class="tag">PAINEL JOVEM</div>
  <div class="count" id="count"></div>

  <img class="person" id="photo" alt="">
  <div class="shade"></div>

  <div class="head">
    <div class="kicker" id="kicker"></div>
    <div class="g" id="g"><span class="ext" id="n1"></span><span class="face" id="n2"></span></div>
    <div class="sur" id="sur"></div>
    <div class="rolebar" id="rolebar"></div>
  </div>

  <div class="bio" id="bio"></div>
  <div class="seal" id="seal" style="display:none"></div>

  <div class="band">
    <svg class="torn" preserveAspectRatio="none" viewBox="0 0 1080 194"><path id="torn" fill="#efeadc"/></svg>
    <div class="c">
      <div class="when"><div class="hi">SÁBADO</div><div>17/10</div><div>19H30</div></div>
      <div class="where"><strong>IGREJA CASA DA PATERNIDADE</strong><small>Av. Zulmira Rosa Antunes, 1424 · Centro, Anchieta - ES</small></div>
    </div>
  </div>
</div>

<script>
  const P = {
    1: {
      n: '01', kicker: 'CONHEÇA A CONVIDADA', first: 'NATHALLIE', sur: 'Braz',
      role: ['EMPRESÁRIA', 'FARMÁCIA'],
      img: 'p_farma.png', h: 1130, left: 330,
      rows: [
        ['NO TRABALHO', 'Empresária há <b>mais de 20 anos</b> no ramo farmacêutico.'],
        ['NA IGREJA', 'Líder do Ministério de Casais <b>Casa na Rocha</b>, na Igreja Cristã Casa da Paternidade.'],
        ['NA FAMÍLIA', 'Esposa do <b>Erisson</b> e mãe do <b>Davi</b>.'],
      ],
    },
    2: {
      n: '02', kicker: 'CONHEÇA O CONVIDADO', first: 'ADRIANO', sur: 'Ramos',
      role: ['ANALISTA', 'MINERAÇÃO'],
      img: 'p_samarco.png', h: 1060, left: 330,
      rows: [
        ['NO TRABALHO', 'Analista, está no setor da mineração há <b>mais de 10 anos</b>.'],
        ['NA IGREJA', 'Pastor na Igreja <b>Assembleia de Deus Boas Novas</b>.'],
        ['NA FAMÍLIA', 'Casado com a <b>Rubiene</b>, pai da <b>Sophia</b> e do <b>Emanuel</b>.'],
      ],
    },
    3: {
      n: '03', kicker: 'CONHEÇA O CONVIDADO', first: 'GEAN', sur: 'Pietro',
      role: ['GOLEIRO', 'BEACH SOCCER'],
      img: 'p_goleiro.png', h: 1090, left: 380,
      seal: ['JÁ DEFENDEU A', 'SELEÇÃO', 'BRASILEIRA'], sealXY: [96, 1380, -8],
      rows: [
        ['NO ESPORTE', 'Já defendeu a <b>Seleção Brasileira</b> e times da <b>Itália</b> e de ligas internacionais.'],
        ['NA IGREJA', 'Serve na <b>Igreja Missão</b>, em Anchieta.'],
        ['NA FAMÍLIA', 'Casado com a <b>Alícia Laís</b> e pai da <b>Laís</b>.'],
      ],
    },
  };
  const d = P[new URLSearchParams(location.search).get('p') || '1'];

  document.getElementById('count').innerHTML = `${d.n}<small>/03</small>`;
  document.getElementById('kicker').textContent = d.kicker;

  // nome: maior tamanho que caiba em 880px
  const n1 = document.getElementById('n1'), n2 = document.getElementById('n2');
  n1.textContent = n2.textContent = d.first;
  let fs = 230; n2.style.fontSize = fs + 'px';
  while (n2.offsetWidth > 860 && fs > 120) { fs -= 4; n2.style.fontSize = fs + 'px'; }
  n1.style.fontSize = fs + 'px';
  document.getElementById('g').style.setProperty('--h', (fs * 1.02) + 'px');
  const sh = []; for (let i = 1; i <= 12; i++) sh.push(`${i}px ${i}px 0 ${i < 4 ? '#7ff0b4' : '#1f9a63'}`);
  n1.style.textShadow = sh.join(',');
  document.getElementById('sur').textContent = d.sur;
  document.getElementById('rolebar').innerHTML = `<span class="a">${d.role[0]}</span><span class="b">${d.role[1]}</span>`;

  const ph = document.getElementById('photo');
  ph.src = d.img; ph.style.height = d.h + 'px'; ph.style.left = d.left + 'px';

  // bio logo abaixo do bloco do nome
  const head = document.querySelector('.head');
  const bio = document.getElementById('bio');
  bio.innerHTML = d.rows.map(([lb, tx]) => `<div class="item"><div class="lb">${lb}</div><p>${tx}</p></div>`).join('');
  // centraliza a coluna (bio + selo) no espaço entre o nome e a faixa
  const top0 = head.offsetTop + head.offsetHeight + 60, bottom0 = 1700;
  const groupH = bio.offsetHeight + (d.seal ? 290 : 0);
  const bioTop = top0 + Math.max(0, (bottom0 - top0 - groupH) / 2);
  bio.style.top = bioTop + 'px';
  if (d.seal) d.sealXY[1] = bioTop + bio.offsetHeight + 60;

  if (d.seal) {
    const se = document.getElementById('seal');
    se.style.display = 'flex';
    se.innerHTML = `<div>${d.seal[0]}<strong>${d.seal[1]}</strong>${d.seal[2]}</div>`;
    se.style.left = d.sealXY[0] + 'px'; se.style.top = d.sealXY[1] + 'px';
    se.style.transform = `rotate(${d.sealXY[2]}deg)`;
  }

  let s = 13; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  let svg = '';
  [[860,700,11],[180,1500,9],[600,1250,6]].forEach(([cx,cy,k0])=>{
    const p0 = r()*6;
    for(let k=1;k<=k0;k++){ const R=k*62; let dd='';
      for(let a=0;a<=64;a++){ const t=a/64*Math.PI*2;
        const rr=R*(1+0.16*Math.sin(3*t+p0+k*.3)+0.08*Math.cos(5*t-p0));
        dd+=(a?'L':'M')+(cx+rr*Math.cos(t)).toFixed(1)+','+(cy+rr*0.82*Math.sin(t)).toFixed(1); }
      svg+=`<path d="${dd}Z" fill="none" stroke="#22c47a" stroke-opacity="${0.08+0.18*(k/k0)}" stroke-width="${k%4?1.6:3}"/>`; }
  });
  document.getElementById('topo').innerHTML = svg;

  let rs='';
  for(let i=0;i<=203;i++){ const y=2030-i*10, L=i%10===0?52:(i%5===0?34:18);
    rs+=`<line x1="${92-L}" y1="${y}" x2="92" y2="${y}" stroke="#0d0d12" stroke-width="${i%10===0?3:1.6}"/>`;
    if(i%10===0&&i>0) rs+=`<text x="4" y="${y+8}" font-family="Montserrat" font-weight="800" font-size="20" fill="#0d0d12">${i}</text>`; }
  document.getElementById('ruler').innerHTML = rs;

  let p='M0,40'; for(let x=0;x<=1080;x+=18){ p+=` L${x},${18+r()*26}`; } p+=' L1080,194 L0,194 Z';
  document.getElementById('torn').setAttribute('d',p);
</script>
</body>
</html>
