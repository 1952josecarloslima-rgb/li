<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Crescer sem se perder</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --navy:#141850; --navy2:#1d2370; --green:#22c47a; --mint:#7ff0b4;
    --paper:#ecebe4; --ink:#0d0d12; --red:#e2342b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;background:var(--navy);overflow:hidden}
  .art{position:relative;width:1080px;height:1920px;overflow:hidden;
    background:radial-gradient(120% 70% at 50% 35%, var(--navy2) 0%, var(--navy) 60%, #0b0d33 100%);}
  svg.layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.55;pointer-events:none}
  .scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 3px, transparent 3px 9px);}

  /* logo */
  .logo{position:absolute;top:56px;left:50%;transform:translateX(-50%) rotate(-3deg);width:118px;
    filter:drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(8px 10px 0 rgba(0,0,0,.35))}

  /* tag de cima */
  .kicker{position:absolute;top:205px;left:78px;font-family:'Space Mono';font-weight:700;
    font-size:27px;letter-spacing:.06em;color:var(--ink);background:var(--paper);
    padding:8px 16px;transform:rotate(-2deg);box-shadow:4px 4px 0 var(--green)}

  /* título */
  .title{position:absolute;left:62px;top:292px;width:960px}
  .crescer{font-family:'Anton';font-size:268px;line-height:.9;color:var(--paper);
    letter-spacing:.005em;position:relative;text-shadow:7px 7px 0 var(--green)}
  .crescer .up{display:inline-block}
  .sem{position:absolute;font-family:'Permanent Marker';color:var(--mint);
    font-size:96px;left:250px;top:236px;transform:rotate(-5deg);white-space:nowrap;
    text-shadow:4px 4px 0 var(--navy), -2px -2px 0 var(--navy)}
  .sem small{font-size:.6em}

  /* régua de crescimento */
  .ruler{position:absolute;right:18px;top:150px;width:96px;height:1040px;background:var(--paper);
    transform:rotate(2.2deg);box-shadow:-6px 8px 0 rgba(0,0,0,.35)}
  .ruler svg{width:100%;height:100%}
  .tape{position:absolute;width:150px;height:46px;background:rgba(236,235,228,.55);
    border-left:2px dashed rgba(0,0,0,.08);border-right:2px dashed rgba(0,0,0,.08)}

  /* versículo */
  .verse{position:absolute;left:78px;top:700px;width:540px;font-family:'Space Mono';
    color:var(--paper);font-size:25px;line-height:1.45}
  .verse b{color:var(--mint);font-weight:700}
  .verse .ref{display:inline-block;margin-top:10px;font-weight:700;font-size:21px;
    background:var(--green);color:var(--ink);padding:3px 10px}

  /* pessoas */
  .people{position:absolute;left:0;right:0;top:880px;height:820px}
  .p{position:absolute;bottom:0;
    filter:drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff)
           drop-shadow(14px 16px 0 rgba(0,0,0,.35));}
  .p1{left:-30px;height:660px}
  .p3{right:-70px;height:690px;z-index:3}
  .p2{left:50%;transform:translateX(-50%);height:760px;z-index:2}

  .label{position:absolute;font-family:'Permanent Marker';font-size:34px;color:var(--ink);
    background:var(--paper);padding:4px 16px 2px;z-index:5;box-shadow:4px 4px 0 rgba(0,0,0,.35);white-space:nowrap}
  .label i{font-style:normal;color:var(--red)}

  /* faixa de informações */
  .info{position:absolute;left:0;right:0;bottom:0;height:310px;z-index:6}
  .info .paper{position:absolute;inset:0;background:var(--paper)}
  .info .content{position:absolute;inset:0;padding:66px 70px 0;color:var(--ink)}
  .bp{display:inline-block;font-family:'Space Mono';font-weight:700;font-size:28px;border:3px solid var(--ink);
    padding:6px 16px;letter-spacing:.04em}
  .when{display:flex;align-items:stretch;margin-top:22px;border:4px solid var(--ink);width:max-content}
  .when div{font-family:'Archivo Black';font-size:58px;padding:2px 26px;line-height:1.15}
  .when div + div{border-left:4px solid var(--ink)}
  .when .hi{background:var(--green)}
  .addr{margin-top:22px;font-family:'Space Mono';font-weight:700;font-size:23px;display:flex;align-items:center;gap:10px}
</style>
</head>
<body>
<div class="art" id="art">

  <!-- curvas de nível (mapa) + rota tracejada -->
  <svg class="layer" id="topo" viewBox="0 0 1080 1920"></svg>
  <div class="scan"></div>
  <svg class="grain" viewBox="0 0 1080 1920" preserveAspectRatio="none">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <!-- régua de crescimento -->
  <div class="ruler"><svg id="ruler" viewBox="0 0 96 1040"></svg></div>
  <div class="tape" style="right:-40px;top:128px;transform:rotate(-14deg)"></div>

  <img class="logo" src="logo.png" alt="">
  <div class="kicker">PAINEL // JOVENS</div>

  <div class="title">
    <div class="crescer">CRES<span class="up">C</span>ER</div>
    <div class="sem">sem se perder</div>
  </div>

  <!-- seta / rota rabiscada -->
  <svg class="layer" viewBox="0 0 1080 1920" style="z-index:3">
    <defs>
      <marker id="ah" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10" fill="none" stroke="#7ff0b4" stroke-width="2"/>
      </marker>
    </defs>
    <path d="M 865 700 C 960 760, 905 860, 820 860 S 690 790, 760 740 S 900 820, 880 905"
          fill="none" stroke="#7ff0b4" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round"/>
    <!-- X do "você está aqui" -->
    <g transform="translate(860 690) rotate(8)" stroke="#e2342b" stroke-width="9" stroke-linecap="round">
      <line x1="-20" y1="-20" x2="20" y2="20"/><line x1="20" y1="-20" x2="-20" y2="20"/>
    </g>
    <!-- estrelinhas -->
    <g fill="#ecebe4">
      <path transform="translate(640 250) scale(1.3)" d="M0,-18 C2,-4 4,-2 18,0 C4,2 2,4 0,18 C-2,4 -4,2 -18,0 C-4,-2 -2,-4 0,-18Z"/>
      <path transform="translate(120 1080) scale(1.1)" d="M0,-18 C2,-4 4,-2 18,0 C4,2 2,4 0,18 C-2,4 -4,2 -18,0 C-4,-2 -2,-4 0,-18Z"/>
    </g>
  </svg>

  <div class="verse">
    “<b>cresçam na graça</b> e no conhecimento de nosso Senhor e Salvador Jesus Cristo.”<br>
    <span class="ref">2 PEDRO 3:18</span>
  </div>

  <div class="people">
    <img class="p p1" src="p_farma.png" alt="">
    <img class="p p3" src="p_goleiro.png" alt="">
    <img class="p p2" src="p_samarco.png" alt="">
  </div>
  <div class="label" style="left:48px;top:1150px;transform:rotate(-5deg)">na <i>farmácia</i></div>
  <div class="label" style="left:395px;top:900px;transform:rotate(3deg)">na <i>mineração</i></div>
  <div class="label" style="right:60px;top:1050px;transform:rotate(-3deg)">no <i>gol</i></div>

  <div class="info">
    <svg class="layer" viewBox="0 0 1080 310" preserveAspectRatio="none" style="top:-26px;height:340px">
      <path id="torn" fill="#ecebe4"/>
    </svg>
    <div class="content">
      <div class="bp">BATE-PAPO + COMUNHÃO</div>
      <div class="when"><div class="hi">SEXTA</div><div>DD/MM</div><div>20H</div></div>
      <div class="addr">
        <svg width="26" height="34" viewBox="0 0 26 34"><path d="M13 0C5.8 0 0 5.8 0 13c0 9.7 13 21 13 21s13-11.3 13-21C26 5.8 20.2 0 13 0z" fill="#e2342b"/><circle cx="13" cy="13" r="5" fill="#ecebe4"/></svg>
        AV. ZULMIRA ROSA ANTUNES, 1424 · CENTRO, ANCHIETA - ES
      </div>
    </div>
  </div>
</div>

<script>
  // pseudo-aleatório fixo para resultado reprodutível
  let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;

  // curvas de nível
  const topo = document.getElementById('topo');
  const centers = [[880,560,11],[160,1500,9],[620,1250,6]];
  let svg = '';
  centers.forEach(([cx,cy,n])=>{
    const ph = r()*6;
    for(let k=1;k<=n;k++){
      const R = k*62; let d='';
      for(let a=0;a<=64;a++){
        const t=a/64*Math.PI*2;
        const rr = R*(1+0.16*Math.sin(3*t+ph+k*.3)+0.08*Math.cos(5*t-ph));
        d += (a?'L':'M')+(cx+rr*Math.cos(t)).toFixed(1)+','+(cy+rr*0.82*Math.sin(t)).toFixed(1);
      }
      svg += `<path d="${d}Z" fill="none" stroke="#22c47a" stroke-opacity="${0.10+0.22*(k/n)}" stroke-width="${k%4?1.6:3}"/>`;
    }
  });
  topo.innerHTML = svg;

  // régua (cm)
  const ru = document.getElementById('ruler'); let rs='';
  for(let i=0;i<=104;i++){
    const y=1030-i*10, L = i%10===0?54:(i%5===0?36:20);
    rs += `<line x1="${96-L}" y1="${y}" x2="96" y2="${y}" stroke="#0d0d12" stroke-width="${i%10===0?3:1.6}"/>`;
    if(i%10===0 && i>0) rs += `<text x="6" y="${y+8}" font-family="Space Mono" font-weight="700" font-size="20" fill="#0d0d12">${100+i}</text>`;
  }
  ru.innerHTML = rs;

  // papel rasgado
  let p='M0,40'; for(let x=0;x<=1080;x+=18){ p+=` L${x},${18+r()*26}`; } p+=' L1080,340 L0,340 Z';
  document.getElementById('torn').setAttribute('d',p);
</script>
</body>
</html>
