<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Crescer sem se perder</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Tema A — azul-marinho + verde (versão aprovada) */
  :root{
    --bg1:#1d2370; --bg2:#141850; --bg3:#0b0d33;
    --title:#ecebe4; --title-shadow:#22c47a;
    --script:#7ff0b4; --script-outline:#141850;
    --topo:#22c47a; --route:#7ff0b4; --star:#ecebe4;
    --body:#ecebe4; --accent:#7ff0b4; --ref-bg:#22c47a; --ref-ink:#0d0d12;
    --kicker-bg:#ecebe4; --kicker-ink:#0d0d12; --kicker-shadow:#22c47a;
    --label-bg:#ecebe4; --label-ink:#0d0d12; --label-hi:#e2342b;
    --band-bg:#ecebe4; --band-ink:#0d0d12; --band-hi:#22c47a; --band-hi-ink:#0d0d12;
    --ruler-bg:#ecebe4; --ruler-ink:#0d0d12; --ruler-op:.32;
    --x:#e2342b; --pin:#e2342b; --scan:rgba(255,255,255,.035);
    --grain-op:.55; --grain-blend:overlay;
  }
  /* Tema B — papel + preto + laranja + azul da igreja */
  body.b{
    --bg1:#f3efe4; --bg2:#ebe5d6; --bg3:#ddd5c2;
    --title:#111111; --title-shadow:#ff5a1f;
    --script:#1b74d1; --script-outline:#f3efe4;
    --topo:#1b74d1; --route:#ff5a1f; --star:#111111;
    --body:#111111; --accent:#1b74d1; --ref-bg:#111111; --ref-ink:#f3efe4;
    --kicker-bg:#111111; --kicker-ink:#f3efe4; --kicker-shadow:#ff5a1f;
    --label-bg:#ffffff; --label-ink:#111111; --label-hi:#1b74d1;
    --band-bg:#111111; --band-ink:#f3efe4; --band-hi:#ff5a1f; --band-hi-ink:#111111;
    --ruler-bg:#111111; --ruler-ink:#f3efe4; --ruler-op:.16;
    --x:#ff5a1f; --pin:#ff5a1f; --scan:rgba(0,0,0,.025);
    --grain-op:.35; --grain-blend:multiply;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;background:var(--bg2);overflow:hidden}
  .art{position:relative;width:1080px;height:1920px;overflow:hidden;
    background:radial-gradient(120% 70% at 50% 35%, var(--bg1) 0%, var(--bg2) 60%, var(--bg3) 100%);}
  svg.layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .grain{position:absolute;inset:0;mix-blend-mode:var(--grain-blend);opacity:var(--grain-op);pointer-events:none}
  .scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg, var(--scan) 0 3px, transparent 3px 9px);}

  .logo{position:absolute;top:66px;left:50%;transform:translateX(-50%);width:112px}
  .logo.color{display:none}
  body.b .logo.white{display:none}
  body.b .logo.color{display:block;transform:translateX(-50%) rotate(-3deg);
    filter:drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(8px 10px 0 rgba(0,0,0,.18))}

  .kicker{position:absolute;top:196px;left:74px;font-family:'Space Mono';font-weight:700;
    font-size:38px;letter-spacing:.06em;color:var(--kicker-ink);background:var(--kicker-bg);
    padding:8px 20px;transform:rotate(-2deg);box-shadow:5px 5px 0 var(--kicker-shadow);z-index:4}

  .title{position:absolute;left:62px;top:292px;width:960px;z-index:3}
  .crescer{font-family:'Anton';font-size:268px;line-height:.9;color:var(--title);
    position:relative;text-shadow:7px 7px 0 var(--title-shadow)}
  .sem{position:absolute;font-family:'Permanent Marker';color:var(--script);
    font-size:104px;left:236px;top:232px;transform:rotate(-5deg);white-space:nowrap;
    text-shadow:4px 4px 0 var(--script-outline), -2px -2px 0 var(--script-outline)}

  /* régua de crescimento — altura total, mais apagada */
  .ruler{position:absolute;right:14px;top:-60px;width:92px;height:2040px;background:var(--ruler-bg);
    transform:rotate(1.2deg);opacity:var(--ruler-op)}
  .ruler svg{width:100%;height:100%}

  .verse{position:absolute;left:78px;top:676px;width:560px;font-family:'Space Mono';
    color:var(--body);font-size:25px;line-height:1.45;z-index:3}
  .verse b{color:var(--accent);font-weight:700}
  .verse .ref{display:inline-block;margin-top:10px;font-weight:700;font-size:21px;
    background:var(--ref-bg);color:var(--ref-ink);padding:3px 10px}

  .people{position:absolute;left:0;right:0;top:905px;height:820px}
  .p{position:absolute;bottom:0;
    filter:drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff)
           drop-shadow(14px 16px 0 rgba(0,0,0,.30));}
  .p1{left:-30px;height:660px}
  .p3{right:-36px;height:680px}
  .p2{left:50%;transform:translateX(-50%);height:760px;z-index:2}

  .label{position:absolute;z-index:5;background:var(--label-bg);color:var(--label-ink);
    padding:8px 18px 6px;box-shadow:4px 4px 0 rgba(0,0,0,.35);white-space:nowrap;line-height:1}
  .label b{display:block;font-family:'Archivo Black';font-size:25px;letter-spacing:.02em}
  .label span{display:block;font-family:'Permanent Marker';font-size:32px;margin-top:4px}
  .label i{font-style:normal;color:var(--label-hi)}

  .info{position:absolute;left:0;right:0;bottom:0;height:310px;z-index:6}
  .info .content{position:absolute;inset:0;padding:66px 70px 0;color:var(--band-ink)}
  .bp{display:inline-block;font-family:'Space Mono';font-weight:700;font-size:28px;border:3px solid var(--band-ink);
    padding:6px 16px;letter-spacing:.04em}
  .when{display:flex;align-items:stretch;margin-top:22px;border:4px solid var(--band-ink);width:max-content}
  .when div{font-family:'Archivo Black';font-size:58px;padding:2px 26px;line-height:1.15}
  .when div + div{border-left:4px solid var(--band-ink)}
  .when .hi{background:var(--band-hi);color:var(--band-hi-ink)}
  .addr{margin-top:22px;font-family:'Space Mono';font-weight:700;font-size:23px;display:flex;align-items:center;gap:10px}
</style>
</head>
<body>
<div class="art" id="art">

  <svg class="layer" id="topo" viewBox="0 0 1080 1920"></svg>
  <div class="scan"></div>
  <svg class="grain" viewBox="0 0 1080 1920" preserveAspectRatio="none">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <div class="ruler"><svg id="ruler" viewBox="0 0 92 2040"></svg></div>

  <img class="logo white" src="logo_white.png" alt="">
  <img class="logo color" src="logo.png" alt="">
  <div class="kicker">PAINEL JOVEM</div>

  <div class="title">
    <div class="crescer">CRESCER</div>
    <div class="sem">sem se perder</div>
  </div>

  <svg class="layer" viewBox="0 0 1080 1920" style="z-index:3">
    <path d="M 865 700 C 960 760, 905 860, 820 860 S 690 790, 760 740 S 900 820, 880 905"
          fill="none" stroke="var(--route)" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round"/>
    <g transform="translate(860 690) rotate(8)" stroke="var(--x)" stroke-width="9" stroke-linecap="round">
      <line x1="-20" y1="-20" x2="20" y2="20"/><line x1="20" y1="-20" x2="-20" y2="20"/>
    </g>
    <g fill="var(--star)">
      <path transform="translate(640 250) scale(1.3)" d="M0,-18 C2,-4 4,-2 18,0 C4,2 2,4 0,18 C-2,4 -4,2 -18,0 C-4,-2 -2,-4 0,-18Z"/>
      <path transform="translate(330 1010) scale(1.1)" d="M0,-18 C2,-4 4,-2 18,0 C4,2 2,4 0,18 C-2,4 -4,2 -18,0 C-4,-2 -2,-4 0,-18Z"/>
    </g>
  </svg>

  <div class="verse">
    “<b>cresçam na graça</b> e no conhecimento de nosso Senhor e Salvador Jesus Cristo.”<br>
    <span class="ref">2 PEDRO 3:18</span>
  </div>

  <div class="people">
    <img class="p p1" src="p_farma.png" alt="">
    <img class="p p3" src="p_goleiro.png" alt="">
    <img class="p p2" src="p_samarco.png" alt="">
  </div>
  <div class="label" style="left:30px;top:1000px;transform:rotate(-5deg)"><b>NATHALLIE BRAZ</b><span>na <i>farmácia</i></span></div>
  <div class="label" style="left:372px;top:862px;transform:rotate(3deg)"><b>ADRIANO RAMOS</b><span>na <i>mineração</i></span></div>
  <div class="label" style="right:30px;top:945px;transform:rotate(-3deg)"><b>GEAN PIETRO</b><span>no <i>beach soccer</i></span></div>

  <div class="info">
    <svg class="layer" viewBox="0 0 1080 310" preserveAspectRatio="none" style="top:-26px;height:340px">
      <path id="torn" fill="var(--band-bg)"/>
    </svg>
    <div class="content">
      <div class="bp">BATE-PAPO + COMUNHÃO</div>
      <div class="when"><div class="hi">SEXTA</div><div>17/10</div><div>19H30</div></div>
      <div class="addr">
        <svg width="26" height="34" viewBox="0 0 26 34"><path d="M13 0C5.8 0 0 5.8 0 13c0 9.7 13 21 13 21s13-11.3 13-21C26 5.8 20.2 0 13 0z" fill="var(--pin)"/><circle cx="13" cy="13" r="5" fill="var(--band-bg)"/></svg>
        AV. ZULMIRA ROSA ANTUNES, 1424 · CENTRO, ANCHIETA - ES
      </div>
    </div>
  </div>
</div>

<script>
  if (new URLSearchParams(location.search).get('tema') === 'b') document.body.classList.add('b');

  let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;

  // curvas de nível
  const topo = document.getElementById('topo');
  const centers = [[880,560,11],[160,1500,9],[620,1250,6]];
  let svg = '';
  centers.forEach(([cx,cy,n])=>{
    const ph = r()*6;
    for(let k=1;k<=n;k++){
      const R = k*62; let d='';
      for(let a=0;a<=64;a++){
        const t=a/64*Math.PI*2;
        const rr = R*(1+0.16*Math.sin(3*t+ph+k*.3)+0.08*Math.cos(5*t-ph));
        d += (a?'L':'M')+(cx+rr*Math.cos(t)).toFixed(1)+','+(cy+rr*0.82*Math.sin(t)).toFixed(1);
      }
      svg += `<path d="${d}Z" fill="none" stroke="var(--topo)" stroke-opacity="${0.10+0.22*(k/n)}" stroke-width="${k%4?1.6:3}"/>`;
    }
  });
  topo.innerHTML = svg;

  // régua (cm) — altura toda da arte
  const ru = document.getElementById('ruler'); let rs='';
  for(let i=0;i<=203;i++){
    const y=2030-i*10, L = i%10===0?52:(i%5===0?34:18);
    rs += `<line x1="${92-L}" y1="${y}" x2="92" y2="${y}" stroke="var(--ruler-ink)" stroke-width="${i%10===0?3:1.6}"/>`;
    if(i%10===0 && i>0) rs += `<text x="4" y="${y+8}" font-family="Space Mono" font-weight="700" font-size="20" fill="var(--ruler-ink)">${i}</text>`;
  }
  ru.innerHTML = rs;

  // papel rasgado
  let p='M0,40'; for(let x=0;x<=1080;x+=18){ p+=` L${x},${18+r()*26}`; } p+=' L1080,340 L0,340 Z';
  document.getElementById('torn').setAttribute('d',p);
</script>
</body>
</html>
